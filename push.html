<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Push-treeniohjelma</title>
  <link rel="stylesheet" href="treeniohjelma.css">
</head>

<body>

  <header>
    <h1>Push – treeniohjelma</h1>
  </header>

  <nav>
    <a href="push.html">Push</a>
    <a href="pull.html">Pull</a>
    <a href="legs.html">Legs</a>
  </nav>

  <main>
    <p>Päivä 1 – PUSH (rinta, olkapäät, ojentajat)</p>

    <section class="exercise-group">
      <h2>Rinta</h2>

      <label>
        <input type="checkbox" data-id="push-penkki">
        Penkkipunnerrus (tanko tai käsipainot) – 3×6–10
      </label>

      <label>
        <input type="checkbox" data-id="push-vino">
        Vinopenkkipunnerrus käsipainoilla – 3×8–12
      </label>

      <label>
        <input type="checkbox" data-id="push-pysty">
        Pystypunnerrus (tanko tai käsipainot) – 3×6–10
      </label>

      <label>
        <input type="checkbox" data-id="push-sivu">
        Sivuvipunostot – 3×12–15
      </label>

      <label>
        <input type="checkbox" data-id="push-dippi">
        Dippi tai ojentajapunnerrus taljassa – 3×8–12
      </label>

      <label>
        <input type="checkbox" data-id="push-punnerrus">
        Ranskalainen punnerrus / köysi taljassa – 2–3×10–15
      </label>
    </section>
  </main>

</body>
</html>
